<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BicyStudio · 个人主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #cfd8e8 0%, #e6d5d9 30%, #d4e2d9 55%, #d3dde8 80%, #e8dcc8 100%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    color: #4a4a57;
  }
  .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .55; z-index: 0; pointer-events: none; }
  .b1 { width: 420px; height: 420px; background: #aec6e8; top: -120px; left: -100px; }
  .b2 { width: 380px; height: 380px; background: #e8b8c4; bottom: -100px; right: -80px; }
  .b3 { width: 300px; height: 300px; background: #b8dcc8; top: 40%; left: 60%; }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 460px;
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 28px;
    box-shadow:
      0 30px 60px rgba(90, 100, 130, 0.25),
      0 12px 24px rgba(90, 100, 130, 0.15),
      0 2px 6px rgba(255, 255, 255, 0.6) inset;
    padding: 44px 36px;
    text-align: center;
  }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    background: linear-gradient(135deg, #a8c6f0, #e8b8c8);
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 700; color: rgba(255,255,255,0.9);
    box-shadow: 0 10px 22px rgba(120, 130, 160, 0.35), 0 3px 8px rgba(255,255,255,0.7) inset;
    border: 2px solid rgba(255,255,255,0.6);
  }
  h1 { font-size: 26px; font-weight: 700; color: #3d3d4a; margin-bottom: 8px; letter-spacing: 1px; }
  .tagline { font-size: 14px; color: #8a8a99; margin-bottom: 26px; }

  .pills { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 30px; }
  .pill {
    padding: 7px 16px; border-radius: 999px; font-size: 13px;
    background: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 4px 10px rgba(100, 110, 140, 0.12), 0 1px 3px rgba(255,255,255,0.5) inset;
    color: #5a5a6b;
  }

  .links { display: flex; flex-direction: column; gap: 14px; }
  .link {
    display: block; padding: 14px 20px; border-radius: 16px;
    background: rgba(255,255,255,0.3);
    border: 1px solid rgba(255,255,255,0.55);
    color: #4a4a57; text-decoration: none; font-size: 15px; font-weight: 600;
    box-shadow: 0 8px 18px rgba(100, 110, 140, 0.14);
    transition: transform .2s, box-shadow .2s;
  }
  .link:hover { transform: translateY(-3px); box-shadow: 0 14px 26px rgba(100, 110, 140, 0.22); }
  footer { margin-top: 28px; font-size: 12px; color: #9a9aa8; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <main class="card">
    <div class="avatar">B</div>
    <h1>BicyStudio</h1>
    <p class="tagline">记录 · 创作 · 分享</p>
    <div class="pills">
      <span class="pill">设计</span>
      <span class="pill">编程</span>
      <span class="pill">音乐</span>
      <span class="pill">生活</span>
    </div>
    <nav class="links">
      <a class="link" href="https://github.com/byxixiaoshao">GitHub</a>
      <a class="link" href="#">博客</a>
      <a class="link" href="#">项目</a>
    </nav>
    <footer>© 2026 BicyStudio</footer>
  </main>
</body>
</html>
